name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  plugin:
    name: dsh-suggest-next-prompt (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: dsh-suggest-next-prompt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: dsh-suggest-next-prompt/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # lib/ is committed on purpose, so two things must hold: it exists, and it
      # matches src/. The existence check is not redundant — an IGNORED lib/ makes
      # the drift check pass on a tree that ships no bundle at all, which is
      # exactly how dsh-chrome-agent once reached a published commit with a
      # manifest pointing at a main that did not exist.
      - name: Committed bundle exists
        run: |
          if [ ! -f lib/index.js ]; then
            echo "lib/index.js is missing. A DSH plugin runs no lifecycle script, so"
            echo "the build output must be committed. Check that .gitignore does not"
            echo "ignore lib/."
            exit 1
          fi
          if [ -z "$(git ls-files lib)" ]; then
            echo "lib/ exists on disk but nothing is committed — it is being ignored."
            exit 1
          fi
          echo "lib/ is committed"

      # …and it must never drift from src/, or the repository ships a bundle that
      # no longer matches its own source.
      - name: Committed bundle matches source
        run: |
          if [ -n "$(git status --porcelain -- lib)" ]; then
            echo "lib/ is stale — rebuild and commit it:"
            git --no-pager diff --stat -- lib
            exit 1
          fi
          echo "lib/ matches src/"

  chrome-agent:
    name: dsh-chrome-agent (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: dsh-chrome-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: dsh-chrome-agent/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # lib/ is committed on purpose, so two things must hold: it exists, and it
      # matches src/. The existence check is not redundant — an IGNORED lib/ makes
      # the drift check pass on a tree that ships no bundle at all.
      - name: Committed bundle exists
        run: |
          if [ ! -f lib/index.js ]; then
            echo "lib/index.js is missing. A DSH plugin runs no lifecycle script, so"
            echo "the build output must be committed. Check that .gitignore does not"
            echo "ignore lib/."
            exit 1
          fi
          if [ -z "$(git ls-files lib)" ]; then
            echo "lib/ exists on disk but nothing is committed — it is being ignored."
            exit 1
          fi
          echo "lib/ is committed"

      # …and it must never drift from src/.
      - name: Committed bundle matches source
        run: |
          if [ -n "$(git status --porcelain -- lib)" ]; then
            echo "lib/ is stale — rebuild and commit it:"
            git --no-pager diff --stat -- lib
            exit 1
          fi
          echo "lib/ matches src/"

      # The extension ships to the Chrome Web Store as its own artifact, packed
      # from extension/ into a root-level zip. Prove that still works, because a
      # broken pack:webstore is not visible from the plugin's own tests.
      - name: Pack the web store zip
        run: npm run pack:webstore

      - name: The zip contains the extension at its root
        working-directory: dsh-chrome-agent
        run: |
          node -e "const z=require('fs').readFileSync('dsh-chrome-agent-webstore.zip');const has=x=>z.includes(Buffer.from(x));if(!has('manifest.json')){console.error('manifest.json missing from zip');process.exit(1)}console.log('webstore zip contains manifest.json at its root')"

  published-artifacts:
    name: published artifacts carry their entry point
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The per-plugin jobs above check the working tree, which is the vantage
      # point that missed the original defect: npm pack includes lib/ whenever the
      # files are on disk, even when .gitignore keeps them out of every commit.
      # This job packs from a fresh clone of the committed tree instead, so an
      # ignored-then-uncommitted bundle fails here rather than at a user's install.
      - name: Pack from the committed tree
        run: node scripts/verify-published-artifacts.mjs
