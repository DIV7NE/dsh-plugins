# dsh-run-in-terminal bundle patch
#
# This is the `dsh.bundle.patch` layer of the package: installing it through
# the official CLI —
#
#   dsh plugin --profile web add <path-to-this-package>
#
# — reconciles `dsh.profile.bundles` against installed packages and, seeing
# this declaration, appends `dsh-run-in-terminal` to the bundle stack. The
# profile boot then merges this patch (a single `insert` of the plugin row),
# so no profile file needs editing by hand.
#
# To use a different shell than the platform default, add it to the row:
#
#   - insert:
#       - id: run-in-terminal
#         name: 'dsh-run-in-terminal'
#         config:
#           shell: 'C:\Program Files\PowerShell\7\pwsh.exe'
#
- insert:
    - id: run-in-terminal
      name: 'dsh-run-in-terminal'
